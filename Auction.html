<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Online Auction System</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <div class="container">
        <h2>Live Auction</h2>

        <div class="auction-card">
            <img src="https://via.placeholder.com/300" alt="Auction Item">

            <h3>Antique Watch</h3>
            <p>Beautiful antique watch available for auction.</p>

            <h3>Current Bid: ₹<span id="currentBid">1000</span></h3>

            <input type="number" id="bidAmount" placeholder="Enter your bid">

            <button onclick="placeBid()">Place Bid</button>

            <p id="message"></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
